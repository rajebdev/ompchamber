<!doctype html>
<html lang="en" data-theme="paper" data-theme-variant="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The theme's canvas color. The SSR shell rewrites this tag in place;
         a second tag would be ignored, since Chrome reads the first. -->
    <meta name="theme-color" content="#faf8f3" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="OMPChamber" />
    <meta
      name="description"
      content="A light e-ink paper developer dashboard and AI Oh-My-Pi web view chamber for CI/CD deployments."
    />
    <title>OMPChamber</title>
    <!-- Relative, not absolute: Bun's HTML loader resolves every local `href`
         against this file and emits a content-hashed copy, so `./public/icon.svg`
         becomes `/icon-<hash>.svg`. An absolute `/icon.svg` is read as a module
         specifier and fails the whole build with "Could not resolve". The
         manifest's OWN icon entries stay absolute — Bun does not rewrite inside
         a copied JSON file, and `public/` is served directly, so `/icon.svg`
         resolves there. -->
    <link rel="manifest" href="./public/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./public/icon.svg" sizes="any" />
    <link rel="icon" type="image/png" href="./public/icon-192x192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./public/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    />
    <!--app-head-->
  </head>
  <body>
    <div id="app"></div>
    <!--app-bootstrap-->
    <!-- The client entry. rsbuild injected this tag into its own output; Bun's
         HTML loader takes it from the source, which is why the file is now a
         bundler entry rather than only a template the server reads. -->
    <script type="module" src="./src/client/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
