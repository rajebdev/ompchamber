name: E2E

# Browser end-to-end specs (Playwright) against a real server booted from a temp
# root. This is the layer above `bun test` — it catches what a component mount
# cannot: a broken client bundle, a stream that never settles, a layout that
# clips at a real panel width.
#
# GATED ON PURPOSE. A browser job is minutes, not seconds, so it runs on a pull
# request only when the `e2e` label is applied, plus nightly on `main` and on
# manual dispatch — the same shape get-bb/bb uses for its (much slower) mobile
# run. The cheap Linux jobs in ci.yml still typecheck, lint and unit-test every
# push; this job is where the assembled product is exercised.
#
# The specs run in `mock` mode (seeded demo data, no `omp` install) and `real`
# mode (a scripted fake `omp` speaking omp's own RPC wire protocol — no model,
# no network, no token spend). Chromium is the required leg; firefox/webkit are
# opt-in via `--project` and are not run here yet.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  schedule:
    # Nightly, 09:41 UTC (off the hour so it does not queue behind other cron).
    - cron: "41 9 * * *"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  chromium:
    name: Chromium specs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Nightly and manual runs always go; a pull request only with the label.
    # A fork PR has no label from us, which is also the right default — the job
    # is not free.
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'e2e')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The browser download is the slow half of the job; the cache key is the
      # resolved Playwright version, so a bump refetches and a source change
      # does not. Pinned by the lockfile — the version is not repeated here.
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      # A separate gate so a type error in the specs is reported as one, not as
      # a mysterious "project not found" three steps later.
      - name: Typecheck the E2E layer
        run: bun run typecheck:e2e

      - name: Run the specs
        run: bun run test:e2e --project=chromium
        env:
          CI: "true"

      # Traces, screenshots and the HTML report are the evidence a failing spec
      # owes the reader; a red run with no artifact is a red run nobody can act
      # on. Uploaded only on failure, because the report is large.
      - name: Upload the failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
